# Builds every RID and produces the package. Split from ci.yml by cost: five native builds are minutes
# each, so nothing here runs the suites. The trigger is a tag push, which is the only event that
# releases: no push to a branch and no pull request starts this workflow, so the package is built where
# it is released, and the GitHub Release this workflow creates is where the package stays available for
# publish.yml to pick up by hand. A manual start runs the same pipeline without attesting or creating a
# release, which is how a package is checked against main before a tag exists. Actions are pinned to a
# commit SHA with their version in a trailing comment; the toolchain pin's comment in ci.yml says why
# Dependabot cannot move that one.
name: release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  # The dry run: `native` and `package` build and check the package on the ref that was chosen, and
  # neither attests nor creates a release, because both are gated on a tag push. The optional input is
  # the one thing a dry run cannot see for itself, the tag the caller intends to create: it is what the
  # sources are checked against when the run has no tag of its own, and it has to agree with the ref
  # when it has one.
  workflow_dispatch:
    inputs:
      tag:
        description: 'The tag this run is a rehearsal for, e.g. v1.0.0 (optional)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  # Before the five native builds: a version the sources disagree on, or a tag that does not name them,
  # is answered in seconds rather than after five runners have built a package nobody can publish. A
  # deleted tag fires the same push event with nothing to build, so it is refused here.
  guard:
    name: guard
    if: github.event.deleted != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the version the sources carry
        shell: bash
        # The ref and the input are read from the environment rather than interpolated into the script: a
        # ref or an input carrying a quote would otherwise break out of the quoting it lands in.
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          # The ref names the tag GitHub started this run for, and the input names the tag a caller
          # intends to create. A run on a branch has no tag of its own, so the input is what is checked
          # there; a run on a tag is about that tag, and an input naming a different one is refused
          # rather than checked in its place.
          tag="$INPUT_TAG"
          if [ "$REF_TYPE" = "tag" ]; then
            if [ -n "$tag" ] && [ "$tag" != "$REF_NAME" ]; then
              echo "the input tag is $tag while this run is for $REF_NAME, so the check would be about a tag this run is not releasing" >&2
              exit 1
            fi
            tag="$REF_NAME"
          fi
          if [ -n "$tag" ]; then
            scripts/version.sh --check --tag "$tag"
          else
            scripts/version.sh --check
          fi

  native:
    name: native (${{ matrix.rid }})
    needs: guard
    strategy:
      # Every RID is its own artifact and its own platform; one failing leg must not hide the others.
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: linux-x64
            # ubuntu-22.04 sets the floor: the staged .so can require glibc symbol versions up to that
            # image's 2.35 and no newer, so it loads on glibc 2.35 or newer and not on musl. The floor
            # the link imposed is unmeasured; linux-arm64 below cross-builds here and shares it.
            os: ubuntu-22.04
          - rid: linux-arm64
            os: ubuntu-22.04
            cross_target: aarch64-unknown-linux-gnu
            cross_linker: aarch64-linux-gnu-gcc
          - rid: osx-x64
            os: macos-14
            cross_target: x86_64-apple-darwin
          - rid: osx-arm64
            os: macos-14
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@a2627de80e5819949c7e1c83ed99b29085fc9bc4 # 1.98.1
      # Only the two legs whose target is not the runner's own architecture need a target installed
      # or a linker to reach it.
      - name: Install the cross linker
        if: matrix.cross_linker
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Add the cross target
        if: matrix.cross_target
        run: rustup target add ${{ matrix.cross_target }}
      # build.sh stages into runtimes/<rid>/native/ and writes the build stamp beside the library, so
      # the artifact below already has the layout the package job unpacks.
      - name: Build the library
        shell: bash
        run: |
          # Cargo takes the linker for a target from a per-target environment variable. It is set only
          # on the leg that needs a cross linker, because an empty value is still a value cargo reads.
          if [ -n "${{ matrix.cross_linker }}" ]; then
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER="${{ matrix.cross_linker }}"
          fi
          scripts/build.sh --rid ${{ matrix.rid }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.rid }}
          # The RID directory rather than the library file: an artifact holds a directory's contents
          # at its root, which is what makes `merge-multiple` below rebuild the staging tree exactly.
          # The stamp travels with it and is never packed: the package project packs the library file
          # by name, and Package_Contains_AllRidsAndLicenses asserts the package carries no stamp.
          path: dotnet/src/RustTrafilatura/runtimes/
          if-no-files-found: error
          # One day, the documented minimum: the package job reads this minutes later and is the only
          # reader there is. A retry of that job a day later finds nothing to download and re-runs the
          # five native builds instead, which is a few minutes of CI against 60 MB kept for five builds
          # no one installs. The package itself is what a consumer gets.
          retention-days: 1

  package:
    name: package
    needs: native
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # actions/attest-build-provenance signs the package through this workflow's OIDC identity,
      # writes the attestation to the repository, and stores the artifact metadata record the
      # attestation refers to; without the last permission it succeeds and creates no record.
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.401
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-*
          # Each artifact carries one runtimes/<rid>/ subtree, so merging them into runtimes/ is what
          # produces the five-RID staging layout release.sh verifies.
          merge-multiple: true
          path: dotnet/src/RustTrafilatura/runtimes/
      # No flags: the release script refuses to pack unless all five RIDs are staged and the README
      # and the license files exist, then runs the package-content tests on what it wrote.
      - name: Pack and check the package
        shell: bash
        run: scripts/release.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nupkg
          path: artifacts/*.nupkg
          if-no-files-found: error
          # Seven days, against one for the five native artifacts: this artifact is what the release job
          # reads, so the longer retention is what lets that job be re-run after a failure without
          # rebuilding the package. What has to last is the release asset, and it already does.
          retention-days: 7
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        # What the attestation covers is the release artifact, so it runs only on a tag push, which is
        # the only run that can release: a manual start builds and checks a package nobody releases. The
        # `github-release` job attaches the exact bytes this step attested to the GitHub Release, and
        # publish.yml verifies that attestation before it pushes them to NuGet.
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        with:
          subject-path: artifacts/*.nupkg

  # The release itself. It is its own job so that contents: write is granted to one job, and the bytes it
  # attaches are the ones the jobs above built and attested rather than a second pack. Re-running this job
  # after a failure updates the release the first attempt created instead of failing on it.
  github-release:
    name: github-release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # No checkout: the action works through the API, and the only file it needs is the downloaded one.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nupkg
          path: artifacts
      # The action creates the release as a draft, uploads the assets and publishes it afterwards, so no
      # release is ever visible without its package attached. The tag is not re-created: the release is
      # made against the tag this run was started for.
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: artifacts/*.nupkg
          # A missing package has to fail here rather than publish a release with no asset on it.
          fail_on_unmatched_files: true
          generate_release_notes: true
          # A tag carrying a pre-release part names a pre-release, and NuGet reads the same suffix the
          # same way from the package's version. The tag pattern this workflow triggers on cannot hold a
          # hyphen except in that suffix, so this one expression is the whole test.
          prerelease: ${{ contains(github.ref_name, '-') }}
