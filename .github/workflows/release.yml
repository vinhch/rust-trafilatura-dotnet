# Builds every RID and produces the package. Split from ci.yml by cost: five native builds are minutes
# each, so nothing here runs the suites. The trigger is a tag push, which is the only event that can
# publish: no push to a branch and no pull request starts this workflow, so the package is built where it
# is released. A manual start runs the same pipeline without the two tag-gated steps, which is how a
# package is checked against main before a tag exists. Actions are pinned to a commit SHA with their
# version in a trailing comment; the toolchain pin's comment in ci.yml says why Dependabot cannot move
# that one.
name: release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  # The dry run: `native` and `package` build and check the package on the ref that was chosen, and
  # neither attests nor publishes, because both are gated on a tag push. The optional input is the one
  # thing a dry run cannot see for itself, the tag the caller intends to create: it is what the sources
  # are checked against when the run has no tag of its own, and it has to agree with the ref when it has
  # one.
  workflow_dispatch:
    inputs:
      tag:
        description: 'The tag this run is a rehearsal for, e.g. v1.0.0 (optional)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  # Before the five native builds: a version the sources disagree on, or a tag that does not name them,
  # is answered in seconds rather than after five runners have built a package nobody can publish. A
  # deleted tag fires the same push event with nothing to build, so it is refused here.
  guard:
    name: guard
    if: github.event.deleted != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the version the sources carry
        shell: bash
        # The ref and the input are read from the environment rather than interpolated into the script: a
        # ref or an input carrying a quote would otherwise break out of the quoting it lands in.
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          # The ref names the tag GitHub started this run for, and the input names the tag a caller
          # intends to create. A run on a branch has no tag of its own, so the input is what is checked
          # there; a run on a tag is about that tag, and an input naming a different one is refused
          # rather than checked in its place.
          tag="$INPUT_TAG"
          if [ "$REF_TYPE" = "tag" ]; then
            if [ -n "$tag" ] && [ "$tag" != "$REF_NAME" ]; then
              echo "the input tag is $tag while this run is for $REF_NAME, so the check would be about a tag this run is not releasing" >&2
              exit 1
            fi
            tag="$REF_NAME"
          fi
          if [ -n "$tag" ]; then
            scripts/version.sh --check --tag "$tag"
          else
            scripts/version.sh --check
          fi

  native:
    name: native (${{ matrix.rid }})
    needs: guard
    strategy:
      # Every RID is its own artifact and its own platform; one failing leg must not hide the others.
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: linux-x64
            # ubuntu-22.04 sets the floor: the staged .so can require glibc symbol versions up to that
            # image's 2.35 and no newer, so it loads on glibc 2.35 or newer and not on musl. The floor
            # the link imposed is unmeasured; linux-arm64 below cross-builds here and shares it.
            os: ubuntu-22.04
          - rid: linux-arm64
            os: ubuntu-22.04
            cross_target: aarch64-unknown-linux-gnu
            cross_linker: aarch64-linux-gnu-gcc
          - rid: osx-x64
            os: macos-14
            cross_target: x86_64-apple-darwin
          - rid: osx-arm64
            os: macos-14
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@a2627de80e5819949c7e1c83ed99b29085fc9bc4 # 1.98.1
      # Only the two legs whose target is not the runner's own architecture need a target installed
      # or a linker to reach it.
      - name: Install the cross linker
        if: matrix.cross_linker
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Add the cross target
        if: matrix.cross_target
        run: rustup target add ${{ matrix.cross_target }}
      # build.sh stages into runtimes/<rid>/native/ and writes the build stamp beside the library, so
      # the artifact below already has the layout the package job unpacks.
      - name: Build the library
        shell: bash
        run: |
          # Cargo takes the linker for a target from a per-target environment variable. It is set only
          # on the leg that needs a cross linker, because an empty value is still a value cargo reads.
          if [ -n "${{ matrix.cross_linker }}" ]; then
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER="${{ matrix.cross_linker }}"
          fi
          scripts/build.sh --rid ${{ matrix.rid }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.rid }}
          # The RID directory rather than the library file: an artifact holds a directory's contents
          # at its root, which is what makes `merge-multiple` below rebuild the staging tree exactly.
          # The stamp travels with it and is never packed: the package project packs the library file
          # by name, and Package_Contains_AllRidsAndLicenses asserts the package carries no stamp.
          path: dotnet/src/RustTrafilatura/runtimes/
          if-no-files-found: error

  package:
    name: package
    needs: native
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # actions/attest-build-provenance signs the package through this workflow's OIDC identity,
      # writes the attestation to the repository, and stores the artifact metadata record the
      # attestation refers to; without the last permission it succeeds and creates no record.
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.401
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-*
          # Each artifact carries one runtimes/<rid>/ subtree, so merging them into runtimes/ is what
          # produces the five-RID staging layout release.sh verifies.
          merge-multiple: true
          path: dotnet/src/RustTrafilatura/runtimes/
      # No flags: the release script refuses to pack unless all five RIDs are staged and the README
      # and the license files exist, then runs the package-content tests on what it wrote.
      - name: Pack and check the package
        shell: bash
        run: scripts/release.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nupkg
          path: artifacts/*.nupkg
          if-no-files-found: error
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        # What the attestation covers is the release artifact, so it runs only on a tag push, which is
        # the only run that can publish: a manual start builds and checks a package nobody releases. The
        # `publish` job publishes the exact bytes this step attested.
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        with:
          subject-path: artifacts/*.nupkg

  publish:
    name: publish
    # Gated on the event and the ref together: only a tag push reaches this job, so a manual start on a
    # tag is a rehearsal rather than a release, and no workflow pushes a version by itself. Re-running the
    # failed jobs of that tag push is what retries a publish. The `nuget` environment's required reviewer
    # is a repository setting; naming the environment here is what routes the run through it.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.401
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nupkg
          path: artifacts
      # --push-only publishes the bytes the package job built and attested. Packing here would write a
      # second file that the attestation does not cover, which is the whole point of reusing the
      # artifact instead of rebuilding it. RELEASE_TAG is the tag this release is for, and the script
      # refuses a tag that does not name the version it is about to publish, so a tag pushed against
      # the wrong commit cannot publish a version nobody asked for. Both values are read from the
      # environment by the script.
      - name: Publish the package
        shell: bash
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: scripts/release.sh --push-only
