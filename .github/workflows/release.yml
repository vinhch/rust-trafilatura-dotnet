# Nothing here publishes to NuGet: publish.yml does that by hand from the release this creates.
name: release

on:
  push:
    tags:
      # `*` is any run of characters but `/`, so a pre-release tag such as v0.0.1-rc.1 matches too.
      - 'v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'The tag this run is a rehearsal for, e.g. v1.0.0 (optional)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  guard:
    name: guard
    # A deleted tag fires the same push event with nothing to build.
    if: github.event.deleted != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the version the sources carry
        shell: bash
        # Read from the environment, not interpolated: a quote in a ref or an input would break out of the
        # quoting it lands in.
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          # The input names the tag a caller intends; a run on a tag is about that tag, so an input naming
          # a different one is refused rather than checked in its place.
          tag="$INPUT_TAG"
          if [ "$REF_TYPE" = "tag" ]; then
            if [ -n "$tag" ] && [ "$tag" != "$REF_NAME" ]; then
              echo "the input tag is $tag while this run is for $REF_NAME, so the check would be about a tag this run is not releasing" >&2
              exit 1
            fi
            tag="$REF_NAME"
          fi
          if [ -n "$tag" ]; then
            scripts/version.sh --check --tag "$tag"
          else
            scripts/version.sh --check
          fi

  # ci.yml does not run for a tag, so this is the release's own checks.
  verify:
    name: verify
    needs: guard
    permissions:
      contents: read
      checks: write
    uses: ./.github/workflows/_ci.yml

  native:
    name: native (${{ matrix.rid }})
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: linux-x64
            # Sets the glibc floor (2.35) the staged .so may need: musl is out, and linux-arm64 shares it.
            os: ubuntu-22.04
          - rid: linux-arm64
            os: ubuntu-22.04
            cross_target: aarch64-unknown-linux-gnu
            cross_linker: aarch64-linux-gnu-gcc
          - rid: osx-x64
            os: macos-14
            cross_target: x86_64-apple-darwin
          - rid: osx-arm64
            os: macos-14
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@a2627de80e5819949c7e1c83ed99b29085fc9bc4 # 1.98.1
      - name: Install the cross linker
        if: matrix.cross_linker
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Add the cross target
        if: matrix.cross_target
        run: rustup target add ${{ matrix.cross_target }}
      - name: Build the library
        shell: bash
        run: |
          # Set only where a cross linker exists: an empty value is still a value cargo reads.
          if [ -n "${{ matrix.cross_linker }}" ]; then
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER="${{ matrix.cross_linker }}"
          fi
          scripts/build.sh --rid ${{ matrix.rid }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.rid }}
          # The RID directory, not the library file, so merge-multiple below rebuilds the staging tree.
          path: dotnet/src/RustTrafilatura/runtimes/
          if-no-files-found: error
          retention-days: 1

  package:
    name: package
    needs: [native, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Without the last permission the attestation step succeeds and stores no record.
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-*
          merge-multiple: true
          path: dotnet/src/RustTrafilatura/runtimes/
      - name: Pack and check the package
        shell: bash
        run: scripts/release.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nupkg
          path: artifacts/*.nupkg
          if-no-files-found: error
          retention-days: 7
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        # publish.yml verifies these bytes before it pushes them.
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        with:
          subject-path: artifacts/*.nupkg

  github-release:
    name: github-release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nupkg
          path: artifacts
      # Draft, then upload, then publish: no release is visible without its package on it.
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: artifacts/*.nupkg
          fail_on_unmatched_files: true
          generate_release_notes: true
          # A pre-release tag names a pre-release; NuGet reads the same suffix from the package version.
          prerelease: ${{ contains(github.ref_name, '-') }}
