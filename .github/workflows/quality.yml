# The rust-only checks that are not a per-push gate.
name: quality

on:
  pull_request:
    # rust/ only: the mutation step fails on an empty diff, and a push trigger would show the skipped step
    # as a green check that measured nothing.
    paths:
      - 'rust/**'
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  mutants:
    name: mutants
    timeout-minutes: 120
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@a2627de80e5819949c7e1c83ed99b29085fc9bc4 # 1.98.1
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: |
            cargo-mutants
            cargo-nextest@0.9.148
      - name: Mutate what the pull request changed
        if: github.event_name == 'pull_request'
        working-directory: rust
        run: |
          diff="$RUNNER_TEMP/mutants-pull-request.diff"
          # --relative: cargo-mutants matches its own paths (`src/lib.rs`) against this diff, so a
          # repo-root path matches nothing.
          git diff --relative "origin/${{ github.base_ref }}...HEAD" > "$diff"
          if [ ! -s "$diff" ]; then
            echo "origin/${{ github.base_ref }}...HEAD produced an empty diff, so this range could not be resolved; failing rather than reporting a pass" >&2
            exit 1
          fi
          echo "files the diff covers: $(grep -c '^diff --git ' "$diff")"
          cargo mutants --in-diff "$diff" --list > "$RUNNER_TEMP/mutants.txt"
          echo "mutants selected by the diff: $(wc -l < "$RUNNER_TEMP/mutants.txt")"
          cargo mutants --in-diff "$diff"
      - name: Mutate the whole crate
        if: github.event_name == 'schedule'
        working-directory: rust
        run: cargo mutants

  bench:
    name: bench
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@a2627de80e5819949c7e1c83ed99b29085fc9bc4 # 1.98.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      # Shared runners are too noisy for absolute milliseconds, so the ratio is what is asserted.
      - name: Stage the host RID's native library
        shell: bash
        run: scripts/build.sh
      - name: Measure the round trip
        shell: bash
        run: scripts/bench.sh

  # An advisory against the lockfile shows up on the weekly run or on a rust/ pull request, not on the
  # release path: the lockfile does not change between releases.
  supply-chain:
    name: supply-chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # cargo-deny comes from PATH, so the toolchain is pinned here rather than taken from the image.
      - uses: dtolnay/rust-toolchain@a2627de80e5819949c7e1c83ed99b29085fc9bc4 # 1.98.1
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-deny
      - name: cargo deny
        working-directory: rust
        run: cargo deny check advisories licenses bans
