# Called by ci.yml on a pull request and a main push, and by release.yml on a tag or a rehearsal dispatch.
name: _ci

on:
  workflow_call:

jobs:
  test:
    name: test (${{ matrix.os }})
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # `toolchain` is the Rust version, kept equal to rust-version in rust/Cargo.toml.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.98.1
          # test.sh checks with rustfmt and clippy; the minimal profile carries neither.
          components: rustfmt, clippy
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-nextest@0.9.148
      # No dotnet-version: the SDK is the one global.json names, here and in every other workflow.
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      - name: Check the version the sources carry
        shell: bash
        run: scripts/version.sh --check
      - name: Stage the host RID's native library
        shell: bash
        run: scripts/build.sh
      - name: Run the Rust and C# suites
        shell: bash
        run: scripts/test.sh --report
      - name: Upload the test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-${{ matrix.os }}
          path: artifacts/test-results/**/*.xml
          if-no-files-found: warn
      - name: Publish the test report
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        with:
          # `java-junit` is the parser for the format, not for a producer: nextest and xunit both write it.
          # The report goes to the job summary, not a check run, so the job needs no checks: write. Past
          # GitHub's 1 MiB summary cap the action lists failed tests only, then trims; the artifact keeps all.
          name: test report (${{ matrix.os }})
          path: artifacts/test-results/rust/*.xml,artifacts/test-results/dotnet/*.xml
          reporter: java-junit
          use-actions-summary: true

  # Ubuntu's case-sensitive filesystem fails a wrong-case path that a Windows checkout would accept.
  docs:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the docs' repo paths and links
        shell: bash
        run: scripts/docs-check.sh

  # IsAotCompatible is a promise to a publishing consumer only if something publishes and runs one.
  Aot_Publish_Extracts_A_Page:
    name: Aot_Publish_Extracts_A_Page (${{ matrix.rid }})
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
            binary: RustTrafilatura.AotConsumer.exe
          - rid: linux-x64
            os: ubuntu-latest
            binary: RustTrafilatura.AotConsumer
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.98.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      # The Linux image ships neither clang nor the zlib headers the AOT linker needs.
      - name: Install the Native AOT toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      - name: Stage the host RID's native library
        shell: bash
        run: scripts/build.sh
      # IL2026 and IL3050 become errors here, so a reflection path cannot slip into the package unnoticed.
      - name: Publish the consumer as Native AOT
        shell: bash
        run: |
          dotnet publish dotnet/tests/RustTrafilatura.AotConsumer/RustTrafilatura.AotConsumer.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            -p:PublishAot=true \
            '-p:WarningsAsErrors=IL2026%3BIL3050' \
            -o artifacts/aot/${{ matrix.rid }}
      - name: Run the published consumer
        shell: bash
        run: |
          binary="artifacts/aot/${{ matrix.rid }}/${{ matrix.binary }}"
          [ -x "$binary" ] || { echo "no published binary at $binary" >&2; exit 1; }
          text="$("$binary")" || { echo "the published consumer exited non-zero" >&2; exit 1; }
          [ -n "$text" ] || { echo "the published consumer printed no extracted text" >&2; exit 1; }
          echo "$text"
