# Publishes a release.yml release to NuGet, by hand, because publishing cannot be undone.
name: publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'The release to publish, e.g. v1.2.3 or 1.2.3. Empty publishes the most recent'
        required: false
        type: string
      dry_run:
        description: 'Check the release and its package, then stop without pushing to NuGet'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    # The required reviewer is a repository setting on this environment, and this name is also what the
    # trusted publishing policy matches on.
    environment: nuget
    permissions:
      contents: read
      id-token: write
    steps:
      # Before the checkout, which needs the resolved tag as its ref. Drafts are skipped; a pre-release is
      # what an empty input is for.
      - name: Resolve the tag to publish
        id: tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="$INPUT_TAG"
          [ -n "$tag" ] || tag="$(gh release list --limit 1 --exclude-drafts --json tagName --jq '.[0].tagName // ""')"
          [ -n "$tag" ] || { echo "no release to publish: pass a tag or create a release first" >&2; exit 1; }
          # A release ref is v<version>; the caller may type the version alone.
          tag="v${tag#[vV]}"
          echo "the release to publish is $tag"
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tag.outputs.tag }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      # What makes the asset's file name the one the script expects in artifacts/.
      - name: Check the version the tag names
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: scripts/version.sh --check --tag "$RELEASE_TAG"
      - name: Download the released package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: gh release download "$RELEASE_TAG" --pattern '*.nupkg' --dir artifacts
      # Verifying the attestation is what proves the downloaded file is the one that release built.
      - name: Verify the package was built by the release workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          for package in artifacts/*.nupkg; do
            gh attestation verify "$package" \
              --repo "$GH_REPO" \
              --signer-workflow "$GH_REPO/.github/workflows/release.yml" \
              --source-ref "refs/tags/$RELEASE_TAG"
          done
      # Runs on a dry run too: the exchange is what proves the policy matches, and an unused key expires.
      - name: Log in to nuget.org for a short-lived API key
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          # The nuget.org profile that owns the package, not an email address.
          user: ${{ secrets.NUGET_USER }}
      - name: Publish to NuGet
        if: ${{ inputs.dry_run != true }}
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: scripts/release.sh --push-only
      - name: Report what the dry run verified
        if: ${{ inputs.dry_run == true }}
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          {
            echo "### Dry run: nothing was pushed"
            echo
            echo "Release: \`$RELEASE_TAG\`"
            echo
            echo 'The package below was downloaded, its attestation verified and a short-lived key'
            echo 'obtained from nuget.org; nothing was pushed.'
            echo
            echo '```'
            ls -l artifacts
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
