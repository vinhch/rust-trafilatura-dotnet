# nextest runs the suite for these mutants because scripts/test.* runs it too: a suite verified with one
# runner and a mutant measured with another would be two different measurements. The fail-fast nextest
# has by default stays on for this (rust/.config/nextest.toml turns it off only in the two profiles that
# write a report), so a mutant dies at its first failing test instead of running the rest.
test_tool = "nextest"

# src/lib.rs is the C ABI glue: the entry points, the out-parameter and cap checks, the pointer views
# and the buffer ownership. Nothing inside the crate calls an export, so a test binary reaches it only
# through the same extern "C" door a foreign caller uses. What decides the exclusion is the residue:
# survivors cluster where no test can look, in the test-hooks-gated live-buffer counter
# that the default feature set does not compile, and in the panic-message path, whose hook swallows
# libtest's own output. That residue would be a permanent weekly survivor list, so the mutant set is
# confined to the two modules that hold the logic the tests aim at: src/contract.rs and src/engine.rs.
# The survivor list has not been re-measured since the stack arithmetic was removed; re-run
# cargo-mutants to refresh it.
exclude_globs = ["src/lib.rs"]
