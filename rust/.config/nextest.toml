# The JUnit reports for the two runs scripts/test.* makes. nextest does not run doctests, which is why
# a `cargo test --doc` step stays beside these two runs rather than disappearing with `cargo test`.
#
# A relative `path` is resolved under `<workspace>/target/nextest/<profile>/`, so reaching the
# repository's gitignored artifacts tree — where the .NET reports are written too, which is what lets
# one report step publish both languages — takes four levels up from `rust/target/nextest/<profile>/`.
# `report-name` is set because the default is the same for every run, and two reports with one name are
# two reports a reader cannot tell apart.
#
# fail-fast is off in the two profiles below and left at nextest's own default (on) in `default`,
# because this one file also serves cargo-mutants: a report wants every test's result, while a mutation
# run wants the first failure that kills the mutant and nothing after it.
[profile.junit-default]
fail-fast = false

[profile.junit-default.junit]
path = "../../../../artifacts/test-results/rust/junit-default.xml"
report-name = "rust default"

[profile.junit-test-hooks]
fail-fast = false

[profile.junit-test-hooks.junit]
path = "../../../../artifacts/test-results/rust/junit-test-hooks.xml"
report-name = "rust test-hooks"
