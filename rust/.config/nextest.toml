# The JUnit reports for the two Rust runs scripts/test.* --report makes. A relative `path` is resolved
# under `<workspace>/target/nextest/<profile>/`, so reaching the repository's gitignored artifacts tree
# — where the .NET reports are written too, which is what lets one report step publish both languages —
# takes four levels up from `rust/target/nextest/<profile>/`. `report-name` is set because the default
# is the same for every run, and two reports with one name are two reports a reader cannot tell apart.
#
# Three profiles, and fail-fast is off in all of them except `default`:
#   plain       what scripts/test.* runs without --report: no file, and every test's result reported at
#               the end rather than at the first failure
#   junit-*     what it runs with --report: the same, plus a file each
#   default     what cargo-mutants runs, where stopping at the first failure is the point
#
# nextest does not run doctests, which is why a `cargo test --doc` step stays beside these runs instead
# of disappearing with `cargo test`.
[profile.plain]
fail-fast = false

[profile.junit-default]
fail-fast = false

[profile.junit-default.junit]
path = "../../../../artifacts/test-results/rust/junit-default.xml"
report-name = "rust default"

[profile.junit-test-hooks]
fail-fast = false

[profile.junit-test-hooks.junit]
path = "../../../../artifacts/test-results/rust/junit-test-hooks.xml"
report-name = "rust test-hooks"
