[package]
name = "rust-trafilatura-ffi"
version = "0.2.0"
edition = "2021"
rust-version = "1.98.1"
# This repository's own source is MIT. The crate links the released core crate, which is
# `Apache-2.0` only, so this field states the license of this repository's own code; the dependency
# graph's expressions are the allow-list in deny.toml rather than part of this declaration.
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# The budget gate is a plain `fn main` timed with `std::time::Instant`, so the harness is off and no
# bench framework is a dependency.
[[bench]]
name = "roundtrip"
harness = false

[dependencies]
trafilatura-rust = { version = "=0.2.0", default-features = false, features = ["decompress"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mimalloc = { version = "0.1", optional = true }

[dev-dependencies]
flate2 = "1.1.10"

[features]
default = ["mimalloc"]
test-hooks = []

[profile.release]
lto = "thin"
# The cdylib crosses to .NET through the C ABI by ordinal, so the symbol table carries nothing a
# consumer needs; stripping it drops ~1.5-2 MB per RID.
strip = true
